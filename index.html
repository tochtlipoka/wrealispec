/* Layout: notebook-paper landing; hero with a corrected notebook line; five letters; four phases; teachers block. */
:root{

  --f-head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0E1322; --sheet:#161D33; --ink:#E5E9F7; --ink-soft:#A1AACB; --rule:#28324F;
  --margin:#F2707F; --ok:#4FC48C; --accent:#7D9BFF; --accent-ink:#0E1322; --chip:#222B47; color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--f-head);line-height:1.15}
h1 em,h2 em{font-style:italic;color:var(--margin)}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px}
.brand{font-family:var(--f-hand);font-weight:700;font-size:2.1rem;color:var(--ink);text-decoration:none;line-height:1}
.brand b{color:var(--margin);font-weight:700}
.nav-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--sheet)}
.langs button{font:700 .8rem var(--f-mono);letter-spacing:.06em;padding:7px 12px;border:0;background:transparent;color:var(--ink-soft);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--f-body);text-decoration:none;border-radius:12px;padding:12px 20px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:.9rem;border-radius:10px}

/* Hero: the whole cover is one spiral notebook sheet */
.hero{padding-block:16px 56px}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:6px 6px 16px 16px;
  box-shadow:0 24px 50px -30px rgba(27,37,89,.45);overflow:hidden}
.sheet::before{content:"";display:block;height:34px;border-bottom:1px solid var(--rule);
  background:radial-gradient(circle at 50% 55%,var(--paper) 0 7px,var(--rule) 7.5px 8.5px,transparent 9px) 0 0/36px 34px repeat-x}
.sheet-body{position:relative;padding:34px clamp(20px,5vw,64px) 44px clamp(58px,9vw,120px);
  background:
   linear-gradient(to right,transparent calc(clamp(58px,9vw,120px) - 22px),var(--margin) calc(clamp(58px,9vw,120px) - 22px),var(--margin) calc(clamp(58px,9vw,120px) - 20.5px),transparent calc(clamp(58px,9vw,120px) - 20.5px)),
   repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--rule) 43px,var(--rule) 44px)}
.hand{font-family:var(--f-hand);font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:2.1;color:var(--ink);margin:0 0 6px;max-width:30em}
.hand .c{position:relative;display:inline-block}
.hand del{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:3px;color:var(--ink-soft)}
.hand ins{position:absolute;left:50%;bottom:62%;transform:translateX(-50%) rotate(-5deg);text-decoration:none;white-space:nowrap;
  color:var(--ok);font-weight:700;font-size:.78em;line-height:1;animation:pen .5s ease-out both}
.hand .caret{color:var(--ok);font-weight:700}
.hand .c:nth-of-type(2) ins{animation-delay:.12s}.hand .c:nth-of-type(3) ins{animation-delay:.24s}.hand .c:nth-of-type(4) ins{animation-delay:.36s}
@keyframes pen{from{opacity:0;transform:translateX(-50%) rotate(-5deg) translateY(6px)}}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--margin)}
.hero h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.01em;margin-top:14px;max-width:13em}
.lead{font-size:1.15rem;color:var(--ink-soft);margin-top:18px;max-width:36em}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.say{margin-top:24px;font-size:.92rem;color:var(--ink-soft)}
.say strong{color:var(--ink)}

section{padding-block:56px;border-top:1px solid var(--rule)}
section h2{font-size:clamp(2.1rem,4.6vw,3.1rem)}
.sub{color:var(--ink-soft);margin-top:10px;max-width:40em}

.letters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:30px}
@media (max-width:820px){.letters{grid-template-columns:minmax(0,1fr)}}
.letter{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.letter .L{font-family:var(--f-hand);font-weight:700;font-size:3rem;line-height:1;color:var(--accent)}
.letter.c{border-color:var(--margin)}
.letter.c .L{color:var(--margin)}
.letter h3{font-size:1.05rem;font-weight:600}
.letter p{font-size:.95rem;color:var(--ink-soft)}
@media (max-width:820px){.letter{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:start;column-gap:12px}.letter .L{grid-row:span 2}}

.phases{list-style:none;margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:ph}
@media (max-width:900px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.phases{grid-template-columns:minmax(0,1fr)}}
.phases li{counter-increment:ph;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.phases li::before{content:"0" counter(ph);font:500 .8rem var(--f-mono);color:var(--margin);letter-spacing:.08em}
.phases h3{font-size:1.2rem;font-weight:800}
.phases p{font-size:.95rem;color:var(--ink-soft)}

.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.lv{font-weight:700;font-size:.92rem;padding:8px 14px;border-radius:999px;color:#fff}
.lv:nth-child(1){background:#C9455A}.lv:nth-child(2){background:#D9782A}.lv:nth-child(3){background:#B8960F}
.lv:nth-child(4){background:#1C7A4E}.lv:nth-child(5){background:#135C3A}
.note{margin-top:16px;color:var(--ink-soft);max-width:40em}

.teach{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:820px){.teach{grid-template-columns:minmax(0,1fr)}}
.teach ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.teach li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.teach li::before{content:"✓";font-weight:700;color:var(--ok);font-size:1.1rem}
.pilot{background:var(--ink);color:var(--paper);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px}
.pilot h3{font-size:1.4rem;font-weight:800}
.pilot p{color:var(--paper);opacity:.85}
.pilot .btn{align-self:flex-start;background:var(--paper);color:var(--ink);border-color:var(--paper)}

.status{font-size:.9rem;color:var(--ink-soft);background:var(--chip);border-radius:12px;padding:14px 16px;margin-top:8px}
footer{padding-block:28px 40px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-size:.9rem;color:var(--ink-soft)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hand ins{animation:none}}
</style>
</head>

  "t.1":"AI does the heavy lifting between classes: correcting, generating audio and tracking progress.",
  "t.2":"Your students arrive prepared, so class time is for real conversation.",
  "t.3":"You offer a full week of practice, not just one hour, which raises the value of what you teach.",
  "t.4":"You get a summary of each student, ready for your video call.",
  "pilot.t":"Pilot program",
  "pilot.d":"We're looking for English teachers and schools who want to try the method with their students.",
  "pilot.cta":"Contact Héctor",
  "status":"Wrealispec is in its pilot phase. The demo shows the full method; AI features will be switched on in the next version.",
  "footer":"Created by <a href=\"https://hpopoca.com\" target=\"_blank\" rel=\"noopener\">Héctor Popoca</a>",
}};
const KEY = "wrealispec.lang";
function pick(){
  try { const s = localStorage.getItem(KEY); if (T[s]) return s; } catch(e){}
  const n = (navigator.languages && navigator.languages[0]) || navigator.language || "es";
  if (/^pt/i.test(n)) return "pt";
  if (/^es/i.test(n)) return "es";
  if (/^en/i.test(n)) return "en";
  return "es";
}
function apply(lang){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { const v = d[el.dataset.i18n]; if (v != null) el.textContent = v; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { const v = d[el.dataset.i18nHtml]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.title = "Wrealispec";
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  try { localStorage.setItem(KEY, b.dataset.lang); } catch(e){}
  apply(b.dataset.lang);
}));
apply(pick());
})();
</script>
